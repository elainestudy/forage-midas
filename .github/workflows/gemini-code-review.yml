name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      GEMINI_MODEL: gemini-3.1-flash-lite
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > pr_diff.txt

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Send diff to Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          REVIEW_PROMPT='You are a senior code reviewer. Review the following GitHub pull request diff. Focus on correctness, bugs, security, maintainability, performance, and test coverage. Return the response in clean Markdown format. Keep the feedback concise and actionable. If there are no meaningful issues, say that no major issues were found.'

          jq -n \
            --arg prompt "$REVIEW_PROMPT" \
            --rawfile diff pr_diff.txt \
            '{contents: [{parts: [{text: ($prompt + "\n\nPR diff:\n```diff\n" + $diff + "\n```")}]}]}' \
            > gemini_request.json

          curl --fail --silent --show-error \
            "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            --data-binary @gemini_request.json \
            > review_result.json

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const rawResult = fs.readFileSync('review_result.json', 'utf8');
            const result = JSON.parse(rawResult);

            if (result.error) {
              throw new Error(`Gemini API error: ${result.error.message || JSON.stringify(result.error)}`);
            }

            const comment = result?.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!comment) {
              console.warn('Gemini returned no review feedback. This may be caused by an empty diff or safety filtering.');
              return;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Gemini AI Code Review\n\n${comment}`,
            });
